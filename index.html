<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>Spider Web Network</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="brand">
      <span class="spider">🕷</span>

      <div>
        <b>SPIDER</b>
        <small>WEB NETWORK</small>
      </div>
    </div>

    <div class="avatar" id="avatar">S</div>

  </header>


  <!-- MAIN CONTENT -->
  <main id="screen"></main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="nav">

    <button data-page="home" class="active">
      ⌂
      <span>Home</span>
    </button>

    <button data-page="games">
      🎮
      <span>Games</span>
    </button>

    <button data-page="tasks">
      ☑
      <span>Tasks</span>
    </button>

    <button data-page="friends">
      👥
      <span>Frens</span>
    </button>

    <button data-page="profile">
      ●
      <span>Profile</span>
    </button>

  </nav>

</div>


<script src="app.js"></script>

</body>
</html>
